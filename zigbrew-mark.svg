<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="zigbrew">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22385c"/><stop offset="1" stop-color="#101c30"/></linearGradient>
    <linearGradient id="cu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2a34a"/><stop offset="1" stop-color="#d4762a"/></linearGradient>
    <linearGradient id="sv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9edf2"/><stop offset="1" stop-color="#9aa6b5"/></linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b5652a"/><stop offset="1" stop-color="#8a4a1c"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g transform="translate(0,3)">
  <!-- Z swoosh with arrow -->
  <path d="M30 11 H48 L34 24 H44" fill="none" stroke="url(#cu)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44 18.6 L52.5 24 L44 29.4 Z" fill="#f2a34a"/>
  <circle cx="55.5" cy="14" r="2.4" fill="#f2a34a" opacity=".9"/>
  <!-- steam -->
  <path d="M15 14 c-2 3 2 5 0 8 M21 12 c-2 3 2 5 0 8" fill="none" stroke="#f2a34a" stroke-width="2" stroke-linecap="round" opacity=".85"/>
  <!-- grounds mound -->
  <path d="M9 33 Q18 19 27 33 Z" fill="#7a4a22"/>
  <path d="M12 33 Q18 24 24 33 Z" fill="#9a5f2c"/>
  <!-- basket -->
  <path d="M8 33 H28 L26 42 a4 4 0 0 1 -4 3 H14 a4 4 0 0 1 -4 -3 Z" fill="url(#sv)"/>
  <rect x="7" y="31" width="22" height="4" rx="2" fill="#e9edf2"/>
  <!-- spout -->
  <path d="M15 45 v4 h6 v-4" fill="none" stroke="#c9d2dd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- handle -->
  <rect x="29" y="34" width="6" height="6" rx="1.5" fill="#c9d2dd"/>
  <rect x="34" y="33.5" width="23" height="7.5" rx="3.75" fill="url(#hd)"/>
  <rect x="52" y="35" width="3" height="4.5" rx="1" fill="#f2a34a" opacity=".7"/>
  </g>
</svg>
